name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Generate Android Files
        run: flutter create . --platforms=android --project-name ayo_lapor_faskam
      - name: Fix SDK to 35
        run: |
          sed -i 's/compileSdk 34/compileSdk 35/g' android/app/build.gradle
          sed -i 's/targetSdk 34/targetSdk 35/g' android/app/build.gradle
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle
          sed -i 's/targetSdkVersion 34/targetSdkVersion 35/g' android/app/build.gradle
      - name: Install Dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
